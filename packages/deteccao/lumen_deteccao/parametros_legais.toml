# Parâmetros legais datados — DOC-09, seção 1.3.
#
# Nenhum valor legal fica no código. Limites de dispensa, percentuais de
# aditivo e prazos mudam por decreto, e um indício calculado hoje sobre um
# ato de 2024 precisa usar o valor vigente em 2024. Sem vigência datada,
# todo reprocessamento histórico produziria indícios errados sem ninguém
# perceber.
#
# Campos de cada entrada:
#   valor         texto, convertido para Decimal (dinheiro nunca é float)
#   vigente_de    primeiro dia de vigência, inclusive
#   vigente_ate   último dia de vigência, inclusive; ausente = ainda vigente
#   fundamento    dispositivo legal que cria o parâmetro
#   atualizado_por  norma que fixou este valor específico
#   verificado    true só depois de conferido na norma original
#   verificado_em data da conferência
#   fonte_verificacao  onde foi conferido
#
# REGRA: parâmetro com verificado = false é recusado por padrão. Uma regra de
# detecção que dependa dele não dispara, e o motivo fica registrado. É melhor
# o sistema calar do que afirmar um limite legal que ninguém conferiu.
#
# Como os valores da Lei 14.133/2021 mudam
# ----------------------------------------
# O art. 182 da lei manda o Executivo federal atualizar os valores a cada 1º
# de janeiro pelo IPCA-E. Cada atualização vem num decreto publicado no fim do
# ano anterior, com um anexo que lista dispositivo por dispositivo. A lei
# entrou em vigor em 1º/04/2021 com os valores originais do próprio texto;
# a primeira atualização vale desde 1º/01/2022.
#
# Conferência de 05/10/2026: todos os valores abaixo foram lidos no texto
# oficial do Planalto (anexo de cada decreto e texto compilado da lei). As
# URLs estão em fonte_verificacao. Ao cadastrar o decreto do ano seguinte:
#   1. encerre a entrada vigente com vigente_ate = 31/12 do ano corrente;
#   2. acrescente a nova entrada com vigente_de = 1º/01 do ano seguinte;
#   3. só marque verificado = true depois de ler o anexo no Planalto.
# O teste test_cobertura_continua_desde_a_lei falha se sobrar um buraco.
#
# Fora do alcance deste arquivo: atos regidos pela Lei 8.666/1993, que
# conviveu com a Lei 14.133 até 30/12/2023 e tinha limites próprios. O PNCP
# só recebe atos da Lei 14.133, então a família B não os encontra; se um dia
# entrarem por outra fonte, precisam de chaves próprias, nunca destas.

