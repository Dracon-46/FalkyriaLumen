name: Dado divergente da fonte oficial
description: Um número no Lumen diferente do publicado pela fonte oficial (TSE, PNCP, SICONFI, IBGE, ANP).
title: "[dado] "
labels: [dado-divergente]
body:
  - type: markdown
    attributes:
      value: |
        Cada número do Lumen aponta para o arquivo oficial de onde saiu e para o SHA-256 da cópia guardada.
        Com o link da fonte e os dois valores, dá para conferir se a diferença vem da fonte, da coleta ou do processamento.
  - type: dropdown
    id: fonte
    attributes:
      label: Fonte oficial
      options:
        - TSE — sistema de resultados (ao vivo)
        - TSE — dados abertos
        - PNCP
        - SICONFI
        - IBGE
        - ANP
        - Outra
    validations:
      required: true
  - type: input
    id: link_fonte
    attributes:
      label: Link da fonte oficial
      description: O endereço da página ou do arquivo oficial com o valor publicado.
      placeholder: "https://..."
    validations:
      required: true
  - type: input
    id: valor_fonte
    attributes:
      label: Valor publicado pela fonte
      placeholder: "ex.: 1.234.567 votos, ou R$ 10.000,00"
    validations:
      required: true
  - type: input
    id: link_lumen
    attributes:
      label: Onde aparece no Lumen
      description: O endereço da página do portal ou o caminho do feed.
      placeholder: "ex.: https://.../eleicoes/?e=2024-1t-municipal&c=prefeito&a=mu-3550308"
    validations:
      required: true
  - type: input
    id: valor_lumen
    attributes:
      label: Valor no Lumen
    validations:
      required: true
  - type: input
    id: afetado
    attributes:
      label: Eleição, ente ou período afetado
      placeholder: "ex.: 2026-1t-geral, presidente, uf-mg; ou município 4319604, RGF 2025"
  - type: input
    id: consulta
    attributes:
      label: Quando você consultou a fonte
      description: Data e hora da consulta; a fonte pode ter corrigido o valor depois da coleta.
      placeholder: "ex.: 16/10/2026 14:30"
  - type: textarea
    id: detalhes
    attributes:
      label: Detalhes
      description: Qualquer informação que ajude a localizar a diferença (linha da tabela, cargo, candidato, filtro usado). Não inclua dados pessoais.
