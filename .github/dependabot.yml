# Atualizações de dependências, uma vez por mês, com no máximo 3 PRs abertos por ecossistema.
# Prefixo de commit no padrão do DOC-09 (Conventional Commits, escopo em português).
# Cada PR passa pela CI como qualquer outro; dependência nova continua exigindo motivo (ADR-015).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    labels: [dependencias]
    commit-message:
      prefix: "chore(acoes)"

  - package-ecosystem: npm
    directory: /packages/portal
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    labels: [dependencias]
    commit-message:
      prefix: "chore(portal)"

  - package-ecosystem: npm
    directory: /docs-src
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    labels: [dependencias]
    commit-message:
      prefix: "chore(documentacao)"

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    labels: [dependencias]
    commit-message:
      prefix: "chore(dependencias)"
