# Painéis de contratações e de conformidade, todo dia — ADR-028.
#
# 1. contratacoes: confere os últimos dias do PNCP (todas as modalidades de
#    contratação e os contratos, pela data de publicação) e coleta os que
#    ainda não estão no estado. Cada dia vira um arquivo compacto,
#    contratacoes-AAAA-MM-DD.json.gz, guardado nos anexos da versão do ano,
#    "painel-dias-AAAA" (ferramentas/painel/dias.sh; os de 2026 coletados antes
#    de 21/10/2026 ficaram na versão "painel-estado", com o resto do estado);
#    um dia com falha na coleta não é gravado e volta na execução seguinte. Atualiza também o cadastro de entes do
#    SICONFI (uma requisição) e as séries de Economia e Contas Públicas do
#    SGS do Banco Central (uma requisição por série, ADR-033; o Ipeadata
#    quando o firewall do BC recusa), as estatais (CVM e SEST, ADR-034) e os
#    portais de transparência avaliados pelo PNTP (ADR-035) e o preço de
#    revenda da ANP por semana (ADR-037; só as planilhas semanais novas, até
#    40 por execução).
# 2. conformidade (todo dia, desde 19/10/2026): o extrato de entregas do
#    SICONFI de todos os entes, em cinco grupos de UFs em paralelo, para o
#    exercício anterior e o corrente e, a cada dia, um exercício encerrado que
#    ainda falte desde 2021 (os já coletados são mantidos); um arquivo por UF
#    no mesmo lugar. Depois,
#    a receita corrente líquida do exercício anterior (RREO, Anexo 03) dos
#    entes que ainda não a têm, no tipo de RREO que o extrato diz que cada um
#    entregou, para os grupos de pares (ADR-038, versão 2): rcl-<UF>.json.gz.
#    Por fim, a despesa por função (DCA, Anexo I-E) dos entes que entregaram
#    a DCA e ainda não a têm, para a comparação com os pares (ADR-041):
#    despesa-funcao-<UF>.json.gz, até 30 minutos por grupo de UFs (a primeira
#    carga de um grupo grande pode levar duas execuções). E a despesa com
#    pessoal do Executivo em % da RCL ajustada (RGF do último período, Anexo
#    1, ADR-042): pessoal-<UF>.json.gz, até 25 minutos por grupo de UFs.
# 3. site: monta e publica o site no GitHub Pages (paineis-site.yml).
#
# A carga dos meses anteriores, em execuções paralelas, é a de
# paineis-carga.yml.
#
# Usa o segredo LUMEN_CONTATO (User-Agent) e o token da própria execução para
# os anexos da versão. Repositório público: os minutos não são cobrados.

name: paineis

on:
  schedule:
    - cron: "17 8 * * *"    # 05:17 em Brasília, todo dia (contratações, economia, estatais, transparência, ANP e conformidade)
  workflow_dispatch:
    inputs:
      ultimos:
        description: "Contratações: quantos dias até ontem conferir (os que faltam são coletados)"
        default: "5"
      conformidade:
        description: "Coletar também a conformidade à mão (nas execuções agendadas, ela roda todo dia)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: paineis
  cancel-in-progress: false

env:
  TAG: painel-estado
  NOTAS: >-
    Estado dos painéis de contratações e de conformidade do Lumen (ADR-028): um arquivo por dia do PNCP,
    um por UF do extrato de entregas do SICONFI e o cadastro de entes. Gerado pelos fluxos paineis e
    paineis-carga; não é uma versão do software.

jobs:
  contratacoes:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      LUMEN_CONTATO: ${{ secrets.LUMEN_CONTATO }}
      LUMEN_DADOS: dados
      GH_TOKEN: ${{ github.token }}
      ULTIMOS: ${{ inputs.ultimos || '5' }}
      # os releases do IBGE da Economia: a API de serviços do IBGE só responde do Brasil (ADR-050, adendo)
      LUMEN_PROXY_BR: ${{ vars.LUMEN_PROXY_BR }}
      LUMEN_PROXY_CHAVE: ${{ secrets.LUMEN_PROXY_CHAVE }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Instalar o Lumen
        run: python -m pip install -e .
      # Só os nomes dos dias já guardados (arquivos vazios no lugar): basta para saber o que falta
      - name: Dias já guardados
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --prerelease --title "Estado dos painéis" --notes "$NOTAS"
          mkdir -p estado
          ferramentas/painel/dias.sh marcar estado
          touch marco
      # Uma vez só (ADR-043): os dias gravados até 20/10/2026 tinham o CPF de MEI no nome do fornecedor e, às
      # vezes, no objeto. Reescreve os que mudaram e marca a versão com mascara-cpf-1.txt.
      - name: CPF mascarado nos dias já guardados (uma vez)
        continue-on-error: true
        run: |
          if gh release view "$TAG" --json assets --jq '.assets[].name' | grep -qx 'mascara-cpf-1.txt'; then
            echo "já feito"; exit 0
          fi
          mkdir -p mascarar
          gh release download "$TAG" -p 'contratacoes-*.json.gz' -D mascarar --clobber
          lumen painel mascarar --estado mascarar > mascarar.json
          python -c "import json; print('\n'.join(json.load(open('mascarar.json'))['alterados']))" > alterados.txt
          echo "$(wc -l < alterados.txt) arquivo(s) reescrito(s)"
          sed 's|^|mascarar/|' alterados.txt | xargs -r gh release upload "$TAG" --clobber
          date -u +%FT%TZ > mascara-cpf-1.txt
          gh release upload "$TAG" mascara-cpf-1.txt --clobber
          rm -rf mascarar
      - name: Cadastro de entes (SICONFI)
        continue-on-error: true
        run: |
          lumen painel cadastro --estado estado
          gh release upload "$TAG" estado/cadastro-entes.json.gz --clobber
      - name: Economia (séries do SGS do Banco Central)
        continue-on-error: true
        run: |
          gh release download "$TAG" -p economia-sgs.json.gz -D estado --clobber || true
          # Grava o estado mesmo quando alguma série falhou: as que vieram ficam, e a falha fica registrada
          status=0
          lumen economia coletar --estado estado || status=1
          gh release upload "$TAG" estado/economia-sgs.json.gz --clobber
          exit $status
      - name: Estatais (dados abertos da CVM e da SEST)
        continue-on-error: true
        run: |
          gh release download "$TAG" -p 'economia-cvm.json.gz' -p 'economia-sest.json.gz' -D estado --clobber || true
          status=0
          lumen economia estatais --estado estado || status=1
          gh release upload "$TAG" estado/economia-cvm.json.gz estado/economia-sest.json.gz --clobber
          exit $status
      - name: Emendas parlamentares (CGU, arquivo de dados abertos; só quando ele muda)
        continue-on-error: true
        run: |
          gh release download "$TAG" -p emendas.json.gz -D estado --clobber || true
          status=0
          lumen painel emendas --estado estado || status=1
          if [ -f estado/emendas.json.gz ]; then gh release upload "$TAG" estado/emendas.json.gz --clobber; fi
          exit $status
      - name: Convênios da União (CGU, arquivo de dados abertos; só quando sai um novo)
        continue-on-error: true
        run: |
          gh release download "$TAG" -p convenios.json.gz -D estado --clobber || true
          status=0
          lumen painel convenios --estado estado || status=1
          if [ -f estado/convenios.json.gz ]; then gh release upload "$TAG" estado/convenios.json.gz --clobber; fi
          exit $status
      # Até 24 meses por execução, com pausa entre eles: o servidor de arquivos da CGU pede verificação humana a
      # quem baixa demais. A primeira carga (de 2014 em diante) se espalha por alguns dias (ADR-054).
      - name: Transferências da União (CGU, arquivo mensal de dados abertos; os meses recentes e os que faltam)
        continue-on-error: true
        run: |
          gh release download "$TAG" -p transferencias.json.gz -D estado --clobber || true
          status=0
          lumen painel transferencias --estado estado || status=1
          if [ -f estado/transferencias.json.gz ]; then gh release upload "$TAG" estado/transferencias.json.gz --clobber; fi
          exit $status
      # Até 12 meses por execução (perto de 24 MB cada), com a mesma pausa: a primeira carga, de 2014 em diante,
      # leva umas duas semanas, dos meses mais novos para os mais antigos (ADR-058).
      - name: Recebimentos da União por favorecido (CGU, arquivo mensal; os meses recentes e os que faltam)
        continue-on-error: true
        run: |
          gh release download "$TAG" -p recebimentos.json.gz -D estado --clobber || true
          status=0
          lumen painel recebimentos --estado estado || status=1
          if [ -f estado/recebimentos.json.gz ]; then gh release upload "$TAG" estado/recebimentos.json.gz --clobber; fi
          exit $status
      - name: Transparência (portais avaliados pelo PNTP)
        continue-on-error: true
        run: |
          gh release download "$TAG" -p transparencia-pntp.json.gz -D estado --clobber || true
          status=0
          lumen painel transparencia --estado estado || status=1
          gh release upload "$TAG" estado/transparencia-pntp.json.gz --clobber
          exit $status
      - name: Preço de revenda da ANP (planilhas semanais)
        continue-on-error: true
        run: |
          gh release download "$TAG" -p anp-semanas.json.gz -D estado --clobber || true
          status=0
          lumen painel anp --estado estado || status=1
          gh release upload "$TAG" estado/anp-semanas.json.gz --clobber
          exit $status
      - name: Dias do PNCP que faltam
        run: lumen painel contratacoes --estado estado --ultimos "$ULTIMOS" --limite-minutos 240
      - name: Guardar os dias novos
        if: always()
        run: find estado -name 'contratacoes-*.json.gz' -newer marco -size +0 -print0 | xargs -0 -r ferramentas/painel/dias.sh guardar

  conformidade:
    if: always() && (inputs.conformidade || github.event_name == 'schedule')
    needs: contratacoes
    runs-on: ubuntu-24.04
    timeout-minutes: 200      # extrato, RCL, DCA e RGF: a primeira carga de cada um pesa; depois, só o que falta
    strategy:
      fail-fast: false
      matrix:
        # Cinco grupos de perto de 1.100 entes cada (duas consultas por ente)
        ufs: ["MG,PB,AC,AP", "SP,PI,RN,AM,RR", "RS,PR,MT,ES", "BA,SC,GO,RJ,RO", "MA,PE,CE,PA,TO,MS,SE,AL,DF"]
    env:
      LUMEN_CONTATO: ${{ secrets.LUMEN_CONTATO }}
      LUMEN_DADOS: dados
      GH_TOKEN: ${{ github.token }}
      UFS: ${{ matrix.ufs }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Instalar o Lumen
        run: python -m pip install -e .
      - name: Cadastro de entes
        run: |
          mkdir -p estado
          gh release download "$TAG" -p cadastro-entes.json.gz -D estado --clobber || lumen painel cadastro --estado estado
      - name: Estado anterior das UFs (exercícios encerrados já coletados)
        run: for uf in ${UFS//,/ }; do gh release download "$TAG" -p "conformidade-$uf.json.gz" -D estado --clobber || true; done
      - name: Extrato de entregas das UFs
        run: lumen painel conformidade --estado estado --ufs "$UFS"
      - name: Guardar as UFs
        if: always()
        run: find estado -name 'conformidade-*.json.gz' -print0 | xargs -0 -r gh release upload "$TAG" --clobber
      - name: Receita corrente líquida dos entes que faltam (para os grupos de pares)
        if: always()
        run: |
          for uf in $(echo "$UFS" | tr ',' ' '); do
            gh release download "$TAG" -p "rcl-$uf.json.gz" -D estado --clobber 2>/dev/null || true
          done
          lumen painel rcl --estado estado --ufs "$UFS" || echo "::warning::RCL com coleta interrompida (ver o registro)"
          find estado -name 'rcl-*.json.gz' -print0 | xargs -0 -r gh release upload "$TAG" --clobber
      - name: Despesa por função dos entes que faltam (DCA, para a comparação com os pares)
        if: always()
        run: |
          for uf in $(echo "$UFS" | tr ',' ' '); do
            gh release download "$TAG" -p "despesa-funcao-$uf.json.gz" -D estado --clobber 2>/dev/null || true
          done
          lumen painel despesa-funcao --estado estado --ufs "$UFS" --limite-minutos 30 \
            || echo "::warning::Despesa por função com coleta interrompida (ver o registro)"
          find estado -name 'despesa-funcao-*.json.gz' -print0 | xargs -0 -r gh release upload "$TAG" --clobber
      - name: Despesa com pessoal do Executivo (RGF, em % da RCL ajustada)
        if: always()
        run: |
          for uf in $(echo "$UFS" | tr ',' ' '); do
            gh release download "$TAG" -p "pessoal-$uf.json.gz" -D estado --clobber 2>/dev/null || true
          done
          lumen painel pessoal --estado estado --ufs "$UFS" --limite-minutos 25 \
            || echo "::warning::Despesa com pessoal com coleta interrompida (ver o registro)"
          find estado -name 'pessoal-*.json.gz' -print0 | xargs -0 -r gh release upload "$TAG" --clobber

  site:
    needs: [contratacoes, conformidade]
    if: always()
    permissions:
      contents: read
      actions: read       # execuções dos fluxos para o painel operacional (ADR-039)
      issues: read       # contestações dos avisos (ADR-047)
      pages: write
      id-token: write
    uses: ./.github/workflows/paineis-site.yml
    secrets: inherit   # contato da coleta da CGU e chaves do bucket privado (J-01, ADR-047)
