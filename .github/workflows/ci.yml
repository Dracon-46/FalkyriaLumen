# Integração contínua do Lumen — DOC-09, seção 4.2.
#
# Os dois estágios bloqueantes que mais importam para este projeto:
#   1. vocabulário controlado — nenhum texto público imputa conduta (ADR-007)
#   2. testes com cobertura mínima de 80% no núcleo (RNF-28)
#
# O repositório é privado: cada execução consome minutos do plano do GitHub.
# A suíte inteira roda em poucos segundos, então o custo é baixo.

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vocabulario:
    name: vocabulário controlado
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verificar termos proibidos nos textos públicos
        run: python ferramentas/lint-vocabulario/lint_vocabulario.py

  testes:
    name: testes (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Dependências de desenvolvimento
        # duckdb: o teste da macro sql/silver_consolidada.sql roda só com ele (ADR-016)
        run: python -m pip install --upgrade pip pytest pytest-cov duckdb
      - name: Suíte completa com cobertura mínima de 80%
        run: >
          python -m pytest
          --cov=lumen_ingestao --cov=lumen_canonico --cov=lumen_deteccao --cov=lint_vocabulario
          --cov=lumen_normalizacao --cov=lumen_conformidade --cov=lumen_orquestracao --cov=lumen_eleicoes --cov=referencia
          --cov-report=term-missing
          --cov-fail-under=80

  estilo:
    name: análise estática (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install ruff
      - run: ruff check packages ferramentas testes

  banco:
    name: migrações no PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lumen
          POSTGRES_PASSWORD: lumen
          POSTGRES_DB: lumen
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lumen" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pytest
      - name: Garantias do banco (somente-anexação, publicação, conformidade)
        env:
          LUMEN_TESTE_PG: postgresql://lumen:lumen@localhost:5432/lumen
        run: python -m pytest -m postgres -q

  portal:
    name: portal (Next.js)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: packages/portal/package-lock.json
      - run: npm ci
      - run: npm run verificar     # tipos + testes
      - run: npm run build         # exportação estática
