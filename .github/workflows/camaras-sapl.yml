# Câmaras municipais com o SAPL do Interlegis e a API aberta (ADR-062): testa o
# endereço sapl.<cidade>.<uf>.leg.br de cada um dos 5.570 municípios, um pedido
# por câmara, e grava camaras-sapl.json.gz na versão "painel-estado", o cadastro
# que a coleta dos vereadores usa. Leva perto de 4 minutos.
#
# No dia 1 de cada mês e à mão. Usa o segredo LUMEN_CONTATO (User-Agent).

name: camaras-sapl

on:
  schedule:
    - cron: "20 7 1 * *"     # dia 1, 04:20 em Brasília
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: camaras-sapl
  cancel-in-progress: false

env:
  TAG: painel-estado

jobs:
  levantar:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      LUMEN_CONTATO: ${{ secrets.LUMEN_CONTATO }}
      LUMEN_DADOS: dados
      GH_TOKEN: ${{ github.token }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Instalar o Lumen
        run: python -m pip install -e .
      - name: Cadastro de entes
        run: |
          mkdir -p estado
          gh release download "$TAG" -p cadastro-entes.json.gz -D estado --clobber
      - name: Levantamento
        shell: bash
        run: |
          lumen painel camaras-sapl --estado estado | tee camaras.json
          gh release upload "$TAG" estado/camaras-sapl.json.gz --clobber
