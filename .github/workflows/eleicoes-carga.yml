# Carga das eleições na nuvem — ADR-026.
#
# Baixa e processa as eleições (sistema de resultados do TSE e dados abertos,
# 1933 a 2024) numa máquina do GitHub, sem nenhum computador pessoal ligado,
# e publica os feeds no Cloudflare R2, de onde o portal os lê.
#
# Retomável: o estado da carga fica no bucket privado. A primeira carga leva
# mais que uma execução (2,3 GB de arquivos do TSE, perto de 450 mil feeds);
# --limite-minutos para a carga antes do prazo da máquina (6 horas), a
# publicação tem 50 minutos de folga para terminar o ano em andamento e para
# entre dois lotes se não der, e a execução seguinte continua de onde esta
# parou. Depois de tudo pronto, cada execução só confere e termina em poucos
# minutos.
#
# Repositório público desde 14/10/2026: os minutos não são cobrados. A
# primeira carga de todos os anos leva algumas horas, em duas ou três
# execuções; as diárias seguintes, poucos minutos.
#
# Configuração (Settings → Secrets and variables → Actions):
#   secrets  LUMEN_CONTATO       e-mail do responsável pela coleta (User-Agent)
#            R2_ENDPOINT         https://<id da conta>.r2.cloudflarestorage.com
#            R2_CHAVE_ACESSO     chave de acesso da API S3 do R2
#            R2_CHAVE_SECRETA    chave secreta da API S3 do R2
#   variables R2_BUCKET_FEEDS    bucket público dos feeds (ex.: lumen-eleicoes)
#             R2_BUCKET_ESTADO   bucket privado do estado (ex.: lumen-privado)
#             R2_REGIAO          região da assinatura S3 (opcional; padrão auto, a do R2)
#             ELEICOES_SEM_HISTORICO  "true" para carregar só 2026, sem os dados
#                                abertos de 1933 a 2024 (opcional)
#             PUBLICACAO_PARALELOS    envios simultâneos (opcional; padrão 32)
#             PUBLICACAO_LIMITE_MB    teto do bucket público em MB (opcional; no
#                                Supabase, 900; 0 tira o teto)
#
# Supabase Storage no lugar do R2 (adendo do ADR-026): os nomes continuam os
# mesmos. R2_ENDPOINT recebe https://<ref>.storage.supabase.co/storage/v1/s3,
# as chaves são as de Storage → S3 do painel e R2_REGIAO a região do projeto
# (ex.: sa-east-1). Com o JSON comprimido, 1933 a 2026 somam perto de 850 MB
# (medição de 14/10/2026) e cabem no 1 GB gratuito; a publicação para antes
# de passar de PUBLICACAO_LIMITE_MB. Passo a passo no DOC-12, seção 9.7.

name: eleicoes-carga

on:
  schedule:
    - cron: "41 7 * * *"   # 04:41 em Brasília, todo dia
  workflow_dispatch:
    inputs:
      anos:
        description: "Anos dos dados abertos, separados por vírgula (vazio = todos)"
        required: false
        default: ""
      sem_ao_vivo:
        description: "Pular o sistema de resultados (eleição corrente)"
        type: boolean
        default: false

permissions:
  contents: read

# Duas cargas ao mesmo tempo disputariam o índice publicado
concurrency:
  group: eleicoes-carga
  cancel-in-progress: false

jobs:
  carga:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    env:
      LUMEN_CONTATO: ${{ secrets.LUMEN_CONTATO }}
      LUMEN_PUBLICACAO_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      LUMEN_PUBLICACAO_BUCKET: ${{ vars.R2_BUCKET_FEEDS }}
      LUMEN_PUBLICACAO_BUCKET_ESTADO: ${{ vars.R2_BUCKET_ESTADO }}
      LUMEN_S3_CHAVE_ACESSO: ${{ secrets.R2_CHAVE_ACESSO }}
      LUMEN_S3_CHAVE_SECRETA: ${{ secrets.R2_CHAVE_SECRETA }}
      LUMEN_PUBLICACAO_REGIAO: ${{ vars.R2_REGIAO }}
      LUMEN_PUBLICACAO_PARALELOS: ${{ vars.PUBLICACAO_PARALELOS || '32' }}
      LUMEN_PUBLICACAO_LIMITE_MB: ${{ vars.PUBLICACAO_LIMITE_MB }}
      LUMEN_ELEICOES_SAIDA: dados/eleicoes/feeds
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Instalar o Lumen
        run: python -m pip install -e .
      # Sem o bucket configurado, a execução agendada só avisa (em vez de falhar todo dia); a disparada à
      # mão falha, para quem disparou ver o motivo.
      - name: Nuvem não configurada
        if: env.LUMEN_S3_CHAVE_ACESSO == '' || env.LUMEN_S3_CHAVE_SECRETA == '' || env.LUMEN_PUBLICACAO_ENDPOINT == ''
        run: |
          echo "::notice::Carga não executada: faltam os segredos R2_ENDPOINT, R2_CHAVE_ACESSO e R2_CHAVE_SECRETA (ver o cabeçalho deste arquivo)."
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then exit 1; fi
      - name: Carga (para sozinha antes do prazo; a próxima execução continua)
        if: env.LUMEN_S3_CHAVE_ACESSO != '' && env.LUMEN_S3_CHAVE_SECRETA != '' && env.LUMEN_PUBLICACAO_ENDPOINT != ''
        env:
          ANOS: ${{ inputs.anos }}
          SEM_AO_VIVO: ${{ inputs.sem_ao_vivo }}
          SEM_HISTORICO: ${{ vars.ELEICOES_SEM_HISTORICO }}
        run: |
          set -- preparar --nuvem --sem-portal --sem-bronze --apagar-zips --limite-minutos 280
          if [ "$SEM_HISTORICO" = "true" ]; then set -- "$@" --sem-historico
          elif [ -n "$ANOS" ]; then set -- "$@" --anos "$ANOS"; fi
          if [ "$SEM_AO_VIVO" = "true" ]; then set -- "$@" --sem-ao-vivo; fi
          python -m lumen_eleicoes "$@"
