# Publicação dos painéis de contratações e de conformidade — ADR-028.
#
# Monta o site inteiro a partir do estado guardado nos anexos das versões
# "painel-estado" (um por UF da conformidade, o cadastro de entes, economia,
# transparência, ANP e o relatório da J-01) e "painel-dias-AAAA" (um arquivo
# por dia do PNCP), mais as contestações dos avisos (issues), e o publica no
# GitHub Pages, de onde o portal lê:
# https://dracon-46.github.io/FalkyriaLumen/
#
# Chamado no fim de paineis.yml e de paineis-carga.yml; pode ser disparado à
# mão para refazer o site. A regra J-01 (sanções da CGU × contratos) roda aqui
# mesmo, com os dias já baixados, para os avisos saírem no mesmo dia sem uma
# segunda publicação: em 22 a 27/10/2026, a publicação refeita pelo
# deteccao-sancoes logo depois da diária esgotou o limite de 1.000 chamadas
# por hora da API do GitHub ao baixar de novo os mais de 2 mil arquivos do
# estado (ADR-047, adendo). Se a CGU não responder, vale o relatório guardado (a avaliação da conformidade usa a data do dia: um
# prazo que vence muda o resultado sem coleta nova).
#
# Configuração, uma vez: Settings → Pages → Build and deployment → Source:
# GitHub Actions (feito em 14/10/2026). Repositório público: Pages e minutos
# do GitHub Actions sem custo.

name: paineis-site

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  actions: read       # execuções dos fluxos para o painel operacional (ADR-039)
  issues: read       # contestações dos avisos (ADR-047)
  pages: write
  id-token: write

concurrency:
  group: paineis-site
  cancel-in-progress: false

jobs:
  site:
    runs-on: ubuntu-24.04
    timeout-minutes: 120   # com o histórico desde 2021: perto de 1.800 dias para baixar e somar
    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: painel-estado
      PYTHONUNBUFFERED: "1"
      # A coleta da CGU se identifica (RF-CO-09); quem chama passa os segredos (secrets: inherit)
      LUMEN_CONTATO: ${{ secrets.LUMEN_CONTATO || 'https://github.com/Dracon-46/FalkyriaLumen' }}
      LUMEN_DADOS: dados
      # Cópia do relatório da J-01 no bucket privado, quando há as chaves (como no eleicoes-carga)
      LUMEN_PUBLICACAO_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      LUMEN_PUBLICACAO_BUCKET: ${{ vars.R2_BUCKET_FEEDS }}
      LUMEN_PUBLICACAO_BUCKET_ESTADO: ${{ vars.R2_BUCKET_ESTADO }}
      LUMEN_S3_CHAVE_ACESSO: ${{ secrets.R2_CHAVE_ACESSO }}
      LUMEN_S3_CHAVE_SECRETA: ${{ secrets.R2_CHAVE_SECRETA }}
      LUMEN_PUBLICACAO_REGIAO: ${{ vars.R2_REGIAO }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Instalar o Lumen
        run: python -m pip install -e .
      - name: Estado dos painéis
        run: |
          mkdir -p estado
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release download "$TAG" -D estado --clobber -p '*.json.gz'
          fi
          ferramentas/painel/dias.sh baixar estado
      - name: Regra J-01 (sanções da CGU × contratos do painel, ADR-031 e ADR-047)
        run: |
          set -- j01 --estado estado --resumo "$GITHUB_STEP_SUMMARY" --saida estado/deteccao-j01.json.gz
          if [ -n "$LUMEN_S3_CHAVE_ACESSO" ] && [ -n "$LUMEN_PUBLICACAO_ENDPOINT" ]; then set -- "$@" --privado; fi
          if lumen coletar cgu_ceis && lumen coletar cgu_cnep && lumen normalizar --fontes cgu_ceis,cgu_cnep \
             && lumen deteccao "$@"; then
            echo "J-01 refeita com o retrato do dia da CGU"
          else
            echo "::warning::J-01 não refeita hoje (CGU ou cruzamento): os avisos usam o último relatório guardado."
          fi
      - name: Contestações dos avisos (issues com o rótulo contestacao, ADR-047)
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/issues?labels=contestacao&state=all&per_page=100" \
            --jq '[.[] | {title, body, state, html_url, created_at, labels: [.labels[].name]}]' | jq -s 'add // []' \
            > estado/contestacoes.json || echo '[]' > estado/contestacoes.json
          echo "contestações: $(jq length estado/contestacoes.json)"
          ls estado | sed -e 's/-[0-9-]*\.json\.gz$//' -e 's/-[A-Z]*\.json\.gz$//' | sort | uniq -c
      - name: Execuções dos fluxos de dados (painel operacional)
        run: |
          desde=$(date -u -d '40 days ago' +%Y-%m-%d)
          if gh run list --repo "$GITHUB_REPOSITORY" --limit 1000 --created ">=$desde"                --json workflowName,event,status,conclusion,createdAt,updatedAt,url > execucoes.tmp; then
            mv execucoes.tmp estado/execucoes.json
          else
            rm -f execucoes.tmp
            echo "::warning::As execuções dos fluxos não puderam ser lidas: o painel operacional sai sem elas."
          fi
      - name: Montar o site
        shell: bash               # com pipefail: um site montado pela metade não é publicado
        run: lumen painel publicar --estado estado --saida site | tee resumo.json
      - name: Economia e Contas Públicas
        run: |
          if [ -s estado/economia-sgs.json.gz ]; then lumen economia publicar --estado estado --saida site
          else echo "::notice::Sem estado da economia ainda: a página fica sem dados até a primeira coleta."; fi
      # O eleitorado (ADR-055) e os horários das urnas (ADR-056) vêm prontos, um pacote por ano feito pelos fluxos
      # eleitorado e horarios: só desempacota
      - name: Eleitorado e horários das urnas
        run: |
          mkdir -p pacotes
          gh release download "$TAG" -p 'eleitorado-*.tar' -p 'horarios-*.tar' -D pacotes --clobber 2>/dev/null || true
          for f in pacotes/eleitorado-*.tar pacotes/horarios-*.tar; do
            [ -e "$f" ] || continue
            tar -xf "$f" -C site
            echo "$f: $(tar -tf "$f" | wc -l) arquivos"
          done
      - name: Resumo
        run: |
          {
            echo "## Painéis publicados"
            echo
            echo '```json'
            cat resumo.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      # A implantação demora com o número de arquivos (perto de 30 mil em outubro de 2026): o padrão de 10
      # minutos estourou em 20/10/2026. A consulta do andamento a cada 5 s (o padrão) esgotou o limite da API em
      # 22/10/2026, com a carga do histórico rodando junto: a cada 30 s basta.
      - id: publicacao
        uses: actions/deploy-pages@v5
        with:
          timeout: 1800000
          reporting_interval: 30000
