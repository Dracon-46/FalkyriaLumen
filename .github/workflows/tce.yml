# Contratos registrados nos tribunais de contas (ADR-050): o LicitaCon do
# TCE-RS (órgãos gaúchos desde 2016), o SIM-AM do TCE-PR (municípios
# paranaenses desde 2013), a API do TCE-PE (órgãos pernambucanos desde
# 2013) e a API do SIM do TCE-CE (municípios cearenses desde 2003), um
# job por tribunal.
#
# Todo dia e à mão. Confere o cabeçalho do arquivo de cada ano e só lê o que
# mudou: um ano fechado, quando o tamanho muda; o corrente e o anterior, uma
# vez por semana. No RS, o ZIP do ano é lido por partes (Range), uns 5 MB por
# ano; no PR, são 399 arquivos pequenos por ano (perto de 80 s); em PE, a API
# não diz se o ano mudou, e o ano fechado é relido uma vez por mês; no CE
# também, com duas consultas paginadas por município e ano. Grava
# tce-<sigla>.json.gz na versão "painel-estado"; o site sai na publicação
# seguinte dos painéis (paineis-site), às 05:17 de Brasília.
#
# Os servidores do TCE-RS e do TCE-CE só respondem a endereços do Brasil, e
# as máquinas do GitHub estão fora: os pedidos a eles passam pelo
# intermediário em São Paulo (infra/proxy-br, função da Vercel), com o
# endereço na variável LUMEN_PROXY_BR e a chave no segredo
# LUMEN_PROXY_CHAVE (ADR-050, adendo).
# Sem a variável ou sem o segredo, os jobs do RS e do CE só avisam.
#
# Usa o segredo LUMEN_CONTATO (User-Agent). Repositório público: os minutos
# não são cobrados.

name: tce

on:
  schedule:
    - cron: "30 6 * * *"     # 03:30 em Brasília, antes da publicação diária dos painéis
  workflow_dispatch:
    inputs:
      anos:
        description: "Só estes anos, separados por vírgula (vazio: do primeiro de cada tribunal ao corrente)"
        default: ""

permissions:
  contents: write

concurrency:
  group: tce
  cancel-in-progress: false

env:
  TAG: painel-estado

jobs:
  tce:
    strategy:
      fail-fast: false
      matrix:
        tribunal: [rs, pr, pe, ce]
    # O TCE-RS recusa os endereços da Vercel desde 28/10/2026 (ADR-050, adendo): com a variável LUMEN_RUNNER_BR, o job
    # do RS roda no runner próprio no Brasil (infra/runner-br), direto, sem o intermediário.
    runs-on: ${{ (matrix.tribunal == 'rs' && vars.LUMEN_RUNNER_BR) && fromJSON('["self-hosted", "lumen-br"]') || 'ubuntu-24.04' }}
    timeout-minutes: 120
    env:
      LUMEN_CONTATO: ${{ secrets.LUMEN_CONTATO }}
      LUMEN_DADOS: dados
      GH_TOKEN: ${{ github.token }}
      ANOS: ${{ inputs.anos }}
      PYTHONUNBUFFERED: "1"
      NO_BRASIL: ${{ (matrix.tribunal == 'rs' && vars.LUMEN_RUNNER_BR) && '1' || '' }}
      LUMEN_PROXY_BR: ${{ !(matrix.tribunal == 'rs' && vars.LUMEN_RUNNER_BR) && vars.LUMEN_PROXY_BR || '' }}
      LUMEN_PROXY_CHAVE: ${{ secrets.LUMEN_PROXY_CHAVE }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Instalar o Lumen
        run: python -m pip install -e .
      - name: Cadastro de entes e o estado anterior
        run: |
          mkdir -p estado
          gh release download "$TAG" -p cadastro-entes.json.gz -D estado --clobber
          gh release download "$TAG" -p "tce-${{ matrix.tribunal }}.json.gz" -D estado --clobber || true
      - name: Contratos do tribunal
        shell: bash               # com pipefail: a falha do lumen não some atrás do tee
        run: |
          if [ -z "$NO_BRASIL" ] && { [ "${{ matrix.tribunal }}" = rs ] || [ "${{ matrix.tribunal }}" = ce ]; } && { [ -z "$LUMEN_PROXY_BR" ] || [ -z "$LUMEN_PROXY_CHAVE" ]; }; then
            echo "::warning::Sem LUMEN_PROXY_BR ou LUMEN_PROXY_CHAVE: o TCE-RS e o TCE-CE só respondem do Brasil e ficam para quando o intermediário estiver configurado."
            exit 0
          fi
          lumen painel tce-${{ matrix.tribunal }} --estado estado --limite-minutos 90 ${ANOS:+--anos "$ANOS"} | tee tce.json
          if python -c "import json, sys; r = json.load(open('tce.json')); sys.exit(0 if r['lidos'] or r['nomes'] else 1)"; then
            gh release upload "$TAG" "estado/tce-${{ matrix.tribunal }}.json.gz" --clobber
          else
            echo "nada mudou"
          fi
