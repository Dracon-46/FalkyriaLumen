# Contratos registrados nos tribunais de contas (ADR-050): o LicitaCon do
# TCE-RS (órgãos gaúchos desde 2016) e o SIM-AM do TCE-PR (municípios
# paranaenses desde 2013), um job por tribunal.
#
# Todo dia e à mão. Confere o cabeçalho do arquivo de cada ano e só lê o que
# mudou: um ano fechado, quando o tamanho muda; o corrente e o anterior, uma
# vez por semana. No RS, o ZIP do ano é lido por partes (Range), uns 5 MB por
# ano; no PR, são 399 arquivos pequenos por ano (perto de 80 s). Grava
# tce-<sigla>.json.gz na versão "painel-estado"; o site sai na publicação
# seguinte dos painéis (paineis-site), às 05:17 de Brasília.
#
# Usa o segredo LUMEN_CONTATO (User-Agent). Repositório público: os minutos
# não são cobrados.

name: tce

on:
  schedule:
    - cron: "30 6 * * *"     # 03:30 em Brasília, antes da publicação diária dos painéis
  workflow_dispatch:
    inputs:
      anos:
        description: "Só estes anos, separados por vírgula (vazio: de 2016 ao corrente)"
        default: ""

permissions:
  contents: write

concurrency:
  group: tce
  cancel-in-progress: false

env:
  TAG: painel-estado

jobs:
  tce:
    strategy:
      fail-fast: false
      matrix:
        tribunal: [rs, pr]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      LUMEN_CONTATO: ${{ secrets.LUMEN_CONTATO }}
      LUMEN_DADOS: dados
      GH_TOKEN: ${{ github.token }}
      ANOS: ${{ inputs.anos }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Instalar o Lumen
        run: python -m pip install -e .
      - name: Cadastro de entes e o estado anterior
        run: |
          mkdir -p estado
          gh release download "$TAG" -p cadastro-entes.json.gz -D estado --clobber
          gh release download "$TAG" -p "tce-${{ matrix.tribunal }}.json.gz" -D estado --clobber || true
      - name: Contratos do tribunal
        run: |
          lumen painel tce-${{ matrix.tribunal }} --estado estado --limite-minutos 90 ${ANOS:+--anos "$ANOS"} | tee tce.json
          if python -c "import json, sys; r = json.load(open('tce.json')); sys.exit(0 if r['lidos'] or r['nomes'] else 1)"; then
            gh release upload "$TAG" "estado/tce-${{ matrix.tribunal }}.json.gz" --clobber
          else
            echo "nada mudou"
          fi
