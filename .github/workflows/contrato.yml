# Testes de contrato contra as fontes reais — DOC-09, seção 4.2: "não bloqueia;
# alarma". Rodam uma vez por dia; uma falha aqui quer dizer que uma fonte mudou
# de formato e o normalizador precisa de revisão antes da próxima carga.

name: contrato-de-fontes

on:
  schedule:
    - cron: "17 9 * * *"   # 06:17 em Brasília
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contrato:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m pip install pytest
      - name: Esquema das fontes reais
        env:
          LUMEN_TESTE_CONTRATO: "1"
          # busca do varejo (ADR-027); vazio quando o segredo não existe
          LUMEN_ML_TOKEN: ${{ secrets.LUMEN_ML_TOKEN }}
          # a API de serviços do IBGE só responde do Brasil: vai pelo intermediário em São Paulo (ADR-050, adendo)
          LUMEN_PROXY_BR: ${{ vars.LUMEN_PROXY_BR }}
          LUMEN_PROXY_CHAVE: ${{ secrets.LUMEN_PROXY_CHAVE }}
        run: python -m pytest -m contrato -q
