# Regra J-01: sanções da CGU × contratos do painel — ADR-031 e ADR-047.
#
# Desde 28/10/2026 a J-01 do dia roda dentro do paineis-site, com os dias que
# ele já baixa (ADR-047, adendo): este fluxo ficou só para rodar à mão, por
# exemplo para refazer o relatório sem esperar a próxima publicação. Baixa o retrato do dia do
# CEIS e do CNEP (arquivos de dados abertos da CGU, sem chave, ADR-030),
# normaliza, pega os contratos já guardados pelo painel (anexos da versão
# "painel-estado") e cruza: contrato com fornecedor que constava num cadastro
# que o impedia de contratar, na data da assinatura.
#
# O relatório vai para o estado dos painéis (deteccao-j01.json.gz, na versão
# "painel-estado"), de onde a próxima publicação o lê se a CGU não responder
# naquele dia, e para o bucket privado, se houver os segredos do eleicoes-carga.

name: deteccao-sancoes

on:
  workflow_dispatch:

permissions:
  contents: write     # o relatório vai para os anexos da versão painel-estado

concurrency:
  group: deteccao-sancoes
  cancel-in-progress: false

jobs:
  j01:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      LUMEN_CONTATO: ${{ secrets.LUMEN_CONTATO }}
      LUMEN_DADOS: dados
      GH_TOKEN: ${{ github.token }}
      LUMEN_PUBLICACAO_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      LUMEN_PUBLICACAO_BUCKET: ${{ vars.R2_BUCKET_FEEDS }}
      LUMEN_PUBLICACAO_BUCKET_ESTADO: ${{ vars.R2_BUCKET_ESTADO }}
      LUMEN_S3_CHAVE_ACESSO: ${{ secrets.R2_CHAVE_ACESSO }}
      LUMEN_S3_CHAVE_SECRETA: ${{ secrets.R2_CHAVE_SECRETA }}
      LUMEN_PUBLICACAO_REGIAO: ${{ vars.R2_REGIAO }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Instalar o Lumen
        run: python -m pip install -e .
      - name: Sanções da CGU (retrato mais recente)
        run: |
          lumen coletar cgu_ceis
          lumen coletar cgu_cnep
          lumen normalizar --fontes cgu_ceis,cgu_cnep
      - name: Contratos guardados pelo painel
        run: ferramentas/painel/dias.sh baixar estado
      - name: Cruzamento
        run: |
          set -- j01 --estado estado --resumo "$GITHUB_STEP_SUMMARY" --saida estado/deteccao-j01.json.gz
          if [ -n "$LUMEN_S3_CHAVE_ACESSO" ] && [ -n "$LUMEN_PUBLICACAO_ENDPOINT" ]; then
            set -- "$@" --privado
          else
            echo "::notice::Sem as chaves do armazenamento: o relatório fica só no estado dos painéis."
          fi
          lumen deteccao "$@"
      - name: Guardar o relatório no estado dos painéis
        run: gh release upload painel-estado estado/deteccao-j01.json.gz --clobber
