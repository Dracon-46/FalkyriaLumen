# Regra J-01 em modo silencioso — ADR-031.
#
# Roda sozinho toda vez que o painel termina de carregar dias novos do PNCP
# (paineis, todo dia, e paineis-carga), e à mão. Baixa o retrato do dia do
# CEIS e do CNEP (arquivos de dados abertos da CGU, sem chave, ADR-030),
# normaliza, pega os contratos já guardados pelo painel (anexos da versão
# "painel-estado") e cruza: contrato com fornecedor que constava num cadastro
# que o impedia de contratar, na data da assinatura.
#
# Nada disto é publicado. O resumo da execução só tem contagens (sem nome de
# fornecedor nem de órgão), e o relatório completo vai para o bucket privado
# do armazenamento (deteccao/j01/ultimo.json.gz), com os mesmos segredos do
# eleicoes-carga. Sem eles, fica só o resumo.

name: deteccao-sancoes

on:
  workflow_run:
    workflows: [paineis, paineis-carga]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deteccao-sancoes
  cancel-in-progress: false

jobs:
  j01:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      LUMEN_CONTATO: ${{ secrets.LUMEN_CONTATO }}
      LUMEN_DADOS: dados
      GH_TOKEN: ${{ github.token }}
      LUMEN_PUBLICACAO_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      LUMEN_PUBLICACAO_BUCKET: ${{ vars.R2_BUCKET_FEEDS }}
      LUMEN_PUBLICACAO_BUCKET_ESTADO: ${{ vars.R2_BUCKET_ESTADO }}
      LUMEN_S3_CHAVE_ACESSO: ${{ secrets.R2_CHAVE_ACESSO }}
      LUMEN_S3_CHAVE_SECRETA: ${{ secrets.R2_CHAVE_SECRETA }}
      LUMEN_PUBLICACAO_REGIAO: ${{ vars.R2_REGIAO }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Instalar o Lumen
        run: python -m pip install -e .
      - name: Sanções da CGU (retrato mais recente)
        run: |
          lumen coletar cgu_ceis
          lumen coletar cgu_cnep
          lumen normalizar --fontes cgu_ceis,cgu_cnep
      - name: Contratos guardados pelo painel
        run: gh release download painel-estado -p 'contratacoes-*.json.gz' -D estado
      - name: Cruzamento (modo silencioso)
        run: |
          set -- j01 --estado estado --resumo "$GITHUB_STEP_SUMMARY"
          if [ -n "$LUMEN_S3_CHAVE_ACESSO" ] && [ -n "$LUMEN_PUBLICACAO_ENDPOINT" ]; then
            set -- "$@" --privado
          else
            echo "::notice::Sem as chaves do armazenamento: só o resumo, sem o relatório completo."
          fi
          lumen deteccao "$@"
