# Release do GitHub a cada tag de versão (v0.8.0, v0.9.0…).
#
# As notas são a seção da versão no CHANGELOG.md, sem edição à mão. O fluxo
# confere que a tag bate com a versão do pyproject.toml, do lumen_canonico e do
# portal: uma release com versões diferentes nos três lugares não sai.

name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v5
      - name: Versões iguais à tag
        run: |
          set -euo pipefail
          v="${TAG#v}"
          py=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -1)
          canonico=$(sed -n 's/^VERSAO_LUMEN = "\(.*\)"/\1/p' packages/canonico/lumen_canonico/__init__.py)
          portal=$(jq -r .version packages/portal/package.json)
          echo "tag $v | pyproject $py | lumen_canonico $canonico | portal $portal"
          [ "$v" = "$py" ] && [ "$v" = "$canonico" ] && [ "$v" = "$portal" ]
      - name: Notas a partir do CHANGELOG
        run: |
          set -euo pipefail
          v="${TAG#v}"
          awk -v v="$v" '
            $0 ~ "^## " v " " { dentro = 1; next }
            dentro && /^## / { exit }
            dentro { print }
          ' CHANGELOG.md > notas.md
          [ -s notas.md ] || { echo "::error::CHANGELOG.md não tem a seção ## $v"; exit 1; }
      - name: Criar a release
        run: gh release create "$TAG" --title "Lumen $TAG" --notes-file notas.md --verify-tag
