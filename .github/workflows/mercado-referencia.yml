# Regra A-05 com dados reais, em modo silencioso — ADR-027.
#
# Disparo manual. Coleta as contratações do PNCP publicadas na janela
# (pregão eletrônico e dispensa), os itens das que tratam de combustível e gás
# de cozinha, o preço de revenda da ANP e grava o relatório de comparação como
# artefato do fluxo (sete dias) e no resumo da execução. Não vai para o
# portal; com o repositório público desde 14/10/2026, o resumo e o artefato
# ficam visíveis a quem abre a execução no GitHub.
#
# Duas fontes da ANP, escolhidas em "fonte_anp":
# - semestral: a série histórica, que sai depois do fim do semestre (em
#   outubro de 2026, a mais recente é 2026-1). A janela precisa caber nos
#   semestres informados.
# - semanal: as planilhas semanais, tiradas da página do levantamento. Cobre
#   o presente e o passado recente (em outubro de 2026 a página citava 192
#   semanas, de setembro de 2022 em diante), com combustíveis e GLP.
#
# A coleta do PNCP roda com -v: cada tentativa com erro sai no registro com o
# status e a URL. O PNCP limita a vazão (429): a coleta cai para 30 e depois 15
# requisições por minuto. Um dia útil tem perto de 90 páginas de pregões e
# dispensas (4.400 compras); a janela padrão, de dois dias, levou 16 minutos
# (13/10/2026), e duas semanas passariam de uma hora. Dos itens, só os
# resultados dos que a regra compara são buscados.
#
# Compras recentes quase não têm resultado publicado ainda: para comparar preço
# homologado, use uma janela de meses atrás com a série semestral.
#
# Para calibrar, "janelas" junta várias janelas curtas numa execução só (ex.:
# 2026-01-20..2026-01-21,2026-03-17..2026-03-18): a coleta passa por cada uma
# e a comparação e a distribuição saem do conjunto, com amostras maiores do
# que as de uma janela só. Preenchida, ela substitui "de" e "ate"; os
# semestres precisam cobrir todas. Cada janela de dois dias leva perto de 17
# minutos.
#
# Usa só o segredo LUMEN_CONTATO (User-Agent).

name: mercado-referencia

on:
  workflow_dispatch:
    inputs:
      de:
        description: "Início da janela de publicação (AAAA-MM-DD)"
        default: "2026-09-22"
      ate:
        description: "Fim da janela (AAAA-MM-DD)"
        default: "2026-09-23"
      fonte_anp:
        description: "Preços da ANP: série semestral, planilhas semanais ou ambas"
        type: choice
        options: [semestral, semanal, ambas]
        default: semanal
      semestres:
        description: "Semestres da ANP (AAAA-S, separados por vírgula; só na série semestral)"
        default: "2026-1"
      series:
        description: "Séries semestrais: ca (combustíveis) e/ou glp (gás de cozinha)"
        default: "ca,glp"
      objeto:
        description: "Expressão procurada no objeto das compras"
        default: "combust|gasolina|diesel|etanol|glp|gas de cozinha|botij"
      janelas:
        description: "Várias janelas AAAA-MM-DD..AAAA-MM-DD, separadas por vírgula (substitui de e ate)"
        default: ""

permissions:
  contents: read

concurrency:
  group: mercado-referencia
  cancel-in-progress: false

jobs:
  referencia:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      LUMEN_CONTATO: ${{ secrets.LUMEN_CONTATO }}
      LUMEN_DADOS: dados
      DE: ${{ inputs.de }}
      ATE: ${{ inputs.ate }}
      FONTE_ANP: ${{ inputs.fonte_anp }}
      SEMESTRES: ${{ inputs.semestres }}
      SERIES: ${{ inputs.series }}
      OBJETO: ${{ inputs.objeto }}
      JANELAS: ${{ inputs.janelas }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Instalar o Lumen
        run: python -m pip install -e .
      # Uma linha por janela em janelas.txt; INICIO e FIM cobrem todas, para a comparação
      - name: Janelas da coleta
        run: |
          if [ -n "$JANELAS" ]; then printf '%s\n' "$JANELAS" | tr ',' '\n' | tr -d ' ' | grep -v '^$' > janelas.txt
          else echo "$DE..$ATE" > janelas.txt; fi
          if grep -qvE '^[0-9]{4}-[0-9]{2}-[0-9]{2}\.\.[0-9]{4}-[0-9]{2}-[0-9]{2}$' janelas.txt; then
            echo "::error::janela fora do formato AAAA-MM-DD..AAAA-MM-DD: $(grep -vE '^[0-9]{4}-[0-9]{2}-[0-9]{2}\.\.[0-9]{4}-[0-9]{2}-[0-9]{2}$' janelas.txt | head -1)"
            exit 1
          fi
          cat janelas.txt
          echo "INICIO=$(cut -c1-10 janelas.txt | sort | head -1)" >> "$GITHUB_ENV"
          echo "FIM=$(cut -c13-22 janelas.txt | sort | tail -1)" >> "$GITHUB_ENV"
      - name: ANP — série semestral
        if: inputs.fonte_anp != 'semanal'
        continue-on-error: true
        run: lumen mercado anp baixar --semestres "$SEMESTRES" --series "$SERIES"
      - name: ANP — planilhas semanais da janela
        if: inputs.fonte_anp != 'semestral'
        continue-on-error: true
        run: |
          while IFS= read -r j; do lumen mercado anp semanas --de "${j%%..*}" --ate "${j##*..}"; done < janelas.txt
      - name: ANP — o que foi lido
        continue-on-error: true
        run: lumen mercado anp resumo
      - name: Municípios do IBGE (nomes)
        run: lumen coletar ibge_localidades --de "$(date +%F)"
      - name: Contratações do PNCP nas janelas
        run: |
          while IFS= read -r j; do
            echo "::group::compras de ${j%%..*} a ${j##*..}"
            lumen -v coletar pncp_contratacoes --de "${j%%..*}" --ate "${j##*..}" --modalidades 6,8
            echo "::endgroup::"
          done < janelas.txt
      - name: Normalizar
        run: lumen normalizar
      - name: Itens e resultados das compras do objeto
        continue-on-error: true
        run: |
          while IFS= read -r j; do
            echo "::group::itens de ${j%%..*} a ${j##*..}"
            lumen -v coletar pncp_itens --de "${j%%..*}" --ate "${j##*..}" --objeto "$OBJETO" --so-comparaveis || echo "::warning::itens de $j interrompidos"
            echo "::endgroup::"
          done < janelas.txt
          lumen normalizar --fontes pncp_itens
      - name: Comparar (regra A-05, modo silencioso)
        continue-on-error: true
        run: lumen mercado comparar --de "$INICIO" --ate "$FIM" --saida relatorio
      - name: Amostras para conferência do formato
        if: always()
        run: |
          python - <<'EOF'
          import io, zipfile
          from pathlib import Path
          from lumen_ingestao.bronze import ArmazemBronzeLocal
          from lumen_mercado import xlsx
          b = ArmazemBronzeLocal(Path("dados/bronze"))
          vistos = set()
          for r in b.listar_registros("anp_precos_combustiveis"):
              _, c = b.recuperar(r.registro_id)
              print("ANP", r.url_solicitada, r.status_http, len(c))
              tipo = "xlsx" if xlsx.eh_xlsx(c) else "zip" if c[:2] == b"PK" else "csv"
              if r.status_http != 200 or tipo in vistos:
                  continue
              vistos.add(tipo)
              if tipo == "xlsx":
                  for i, linha in enumerate(xlsx.linhas(c)):
                      if i < 12 or 2000 <= i < 2003:
                          print("XLSX", i, linha[:16])
                      if i > 2003:
                          break
                  continue
              if tipo == "zip":
                  z = zipfile.ZipFile(io.BytesIO(c))
                  print("ZIP", z.namelist())
                  c = z.read(z.namelist()[0])
              linhas = c.split(b"\n")
              print("PRIMEIRAS LINHAS")
              for l in linhas[:3]:
                  print(repr(l[:400]))
              print("LINHAS 2000-2003")
              for l in linhas[2000:2004]:
                  print(repr(l[:400]))
          n = 0
          for r in b.listar_registros("pncp_itens"):
              if r.status_http == 200 and r.url_solicitada.endswith("/itens") and n < 2:
                  _, c = b.recuperar(r.registro_id)
                  print("ITENS", r.url_solicitada, c[:1500].decode("utf-8", "replace"))
                  n += 1
          EOF
          head -c 3000 relatorio/comparacoes.csv || true
      - name: Resumo
        if: always()
        run: |
          if [ -f relatorio/resumo.md ]; then cat relatorio/resumo.md >> "$GITHUB_STEP_SUMMARY"; fi
          if [ -f relatorio/distribuicao.json ]; then cat relatorio/distribuicao.json; fi
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: relatorio-a05
          path: relatorio/
          retention-days: 7
          if-no-files-found: ignore
