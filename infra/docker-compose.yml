# Ambiente local completo do Lumen — DOC-10, fase 0: "executável por um
# único comando".
#
#   docker compose -f infra/docker-compose.yml up -d
#
# Sobe:
#   postgres  banco de domínio, com a migração 0001 aplicada na primeira subida
#   minio     armazenamento de objetos compatível com S3, para a camada bronze
#   minio-init cria o bucket com Object Lock (retenção WORM) e versionamento
#
# Credenciais abaixo são só de desenvolvimento local e estão no repositório de
# propósito. Em qualquer outro ambiente vêm de cofre de segredos (RNF-13).

name: lumen

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: lumen
      POSTGRES_PASSWORD: lumen-dev-local
      POSTGRES_DB: lumen
    ports:
      - "5432:5432"
    volumes:
      - lumen-pg:/var/lib/postgresql/data
      - ../packages/canonico/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lumen -d lumen"]
      interval: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: lumen
      MINIO_ROOT_PASSWORD: lumen-dev-local
    ports:
      - "9000:9000"   # API S3
      - "9001:9001"   # console web
    volumes:
      - lumen-minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set lumen http://minio:9000 lumen lumen-dev-local &&
      (mc ls lumen/lumen-bronze >/dev/null 2>&1 || mc mb --with-lock lumen/lumen-bronze) &&
      mc version enable lumen/lumen-bronze &&
      echo 'bucket lumen-bronze pronto (Object Lock + versionamento)'
      "

volumes:
  lumen-pg:
  lumen-minio:
